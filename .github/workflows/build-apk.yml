name: Compiler Télécommande Connect TV
on:
  push:
    branches: [connecttv-telecommande]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Installer SDK Android
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compiler APK
        run: gradle --no-daemon assembleDebug
      - name: Vérifier signature et version Android
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --min-sdk-version 30 --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -15
      - uses: actions/upload-artifact@v4
        with:
          name: ConnectTV-Express-APK
          path: app/build/outputs/apk/debug/app-debug.apk