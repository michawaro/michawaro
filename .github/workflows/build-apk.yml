name: Construire l'APK Android
on:
  push:
    branches:
      - sfr-telecommande-express
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Installer SDK Android
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "SDK manager absent"; exit 1; fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Construire l'application
        run: gradle --no-daemon assembleDebug
      - name: Signer avec APKSigner pour Android 11 (V1 et V2)
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled false \
            --out app/build/outputs/apk/debug/app-debug-dual.apk \
            app/build/outputs/apk/debug/app-debug.apk
          mv app/build/outputs/apk/debug/app-debug-dual.apk \
             app/build/outputs/apk/debug/app-debug.apk
      - name: Vérifier les signatures et la compatibilité Android 11
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --min-sdk-version 30 --verbose --print-certs \
            app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging \
            app/build/outputs/apk/debug/app-debug.apk | head -15
      - uses: actions/upload-artifact@v4
        with:
          name: SFR-Telecommande-Express-APK
          path: app/build/outputs/apk/debug/*.apk
